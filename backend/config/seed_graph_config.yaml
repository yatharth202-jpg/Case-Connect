edge_types:
  - type_name: "CALLED"
    label: "Voice / SMS Communication"
    color: "#059669"
    line_style: "solid"
    directional: true
  - type_name: "TRANSFERRED"
    label: "Financial Transaction"
    color: "#D97706"
    line_style: "solid"
    directional: true
  - type_name: "OWNS"
    label: "Subscriber / Account Ownership"
    color: "#2563EB"
    line_style: "dashed"
    directional: true
  - type_name: "USES_DEVICE"
    label: "IMEI / Device Association"
    color: "#475569"
    line_style: "dotted"
    directional: true
  - type_name: "USED_IP"
    label: "IP Session Login"
    color: "#0891B2"
    line_style: "dotted"
    directional: true
  - type_name: "MENTIONED_IN"
    label: "FIR Allegation Reference"
    color: "#991B1B"
    line_style: "dashed"
    directional: true
  - type_name: "ASSOCIATED_WITH"
    label: "Forensic Correlation"
    color: "#64748B"
    line_style: "solid"
    directional: false

score_weights:
  weight_degree: 0.20
  weight_betweenness: 0.25
  weight_pagerank: 0.20
  weight_pass_through: 0.20
  weight_total_paise: 0.10
  weight_cross_case: 0.05
  conflict_confidence_margin: 0.15

