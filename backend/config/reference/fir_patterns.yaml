role_rules:
  - role: "complainant"
    pattern: "\\b(?:Complainant|Informant|Victim|Shikayatkarta|Reporting\\s+Person)\\s*[:\\-]?\\s*(?:\\([a-z]\\)\\s*Name\\s*[:\\-]?\\s*)?(?:(?:Shri|Smt\\.?|Mr\\.?|Mrs\\.?|Ms\\.?|Dr\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){0,3})"
    confidence: 0.94
  - role: "complainant"
    pattern: "\\b(?:complainant|informant|victim|shikayatkarta)[,\\s]+(?:(?:Shri|Smt\\.?|Mr\\.?|Mrs\\.?|Ms\\.?|Dr\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){1,3})"
    confidence: 0.92
  - role: "accused"
    pattern: "\\b(?:Accused(?:\\s+Person)?|Named\\s+Accused|Abhiyukt|Aropi|Arrested\\s+accused)\\s*[:\\-]?\\s*(?:\\(\\d+\\)\\s*)?(?:(?:Shri|Smt\\.?|Mr\\.?|Mrs\\.?|Ms\\.?|Dr\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){0,3})"
    confidence: 0.93
  - role: "witness"
    pattern: "\\b(?:Witness(?:es)?|Gawah|Sakshi|Panch\\s+Witness)\\s*[:\\-]?\\s*(?:\\(\\d+\\)\\s*)?(?:(?:Shri|Smt\\.?|Mr\\.?|Mrs\\.?|Ms\\.?|Dr\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){0,3})"
    confidence: 0.91
  - role: "police_officer"
    pattern: "\\b(?:IO|SHO|Investigating\\s+Officer|Officer\\s+in\\s+charge|Recorded\\s+by|Seizing\\s+officer)\\s*[:\\-]\\s*(?:(?:SI|Insp\\.?|Inspector|Sub-Inspector|HC|Const\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,3})"
    confidence: 0.95

kinship_and_residence_rules:
  - marker_type: "S/O"
    relationship_type: "SON_OF"
    pattern: "\\b((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,2})\\s+(?:S/o|s/o|son\\s+of|putra)\\s+(?:(?:Shri|Late|Mr\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,2})"
    confidence: 0.92
  - marker_type: "W/O"
    relationship_type: "WIFE_OF"
    pattern: "\\b((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,2})\\s+(?:W/o|w/o|wife\\s+of|patni)\\s+(?:(?:Shri|Late|Mr\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,2})"
    confidence: 0.92
  - marker_type: "D/O"
    relationship_type: "DAUGHTER_OF"
    pattern: "\\b((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,2})\\s+(?:D/o|d/o|daughter\\s+of|putri)\\s+(?:(?:Shri|Late|Mr\\.?)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,2})"
    confidence: 0.92
  - marker_type: "R/O"
    relationship_type: "RESIDES_AT"
    pattern: "\\b((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+[A-Z][A-Za-z\\'-]+){0,2})\\s+(?:[^.\\n]{0,45}?\\s+)?(?:R/o|r/o|resident\\s+of|niwasi)\\s+([A-Za-z0-9,\\s\\-]{4,60}?)(?=[.;\\n]|\\s+(?:mobile|phone|account|a/c|who|reported|stated|having|and\\s+mobile)|$)"
    confidence: 0.89

sentence_relation_patterns:
  person_phone:
    - name: "phone_of_person"
      pattern: "(?:mobile|phone|contact|cell|sim)(?:\\s+no\\.?|\\s+number)?\\s*[:\\-]?\\s*(?:\\+?91[\\s\\-]?)?([6-9]\\d{4}[\\s\\-]?\\d{5})\\s+(?:of|belonging\\s+to|used\\s+by|registered\\s+to|in\\s+name\\s+of)\\s+(?:(?:Shri|Smt\\.?|Mr\\.?|Mrs\\.?|Ms\\.?|accused|complainant)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){0,3})"
      phone_group: 1
      person_group: 2
      relationship_type: "USES"
      confidence: 0.94
    - name: "person_uses_phone"
      pattern: "((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){0,3})\\s+(?:used|uses|using|called\\s+from|contacted\\s+from|ka\\s+mobile(?:\\s+number)?|mobile(?:\\s+no\\.?|\\s+number)?)\\s*[:\\-]?\\s*(?:\\+?91[\\s\\-]?)?([6-9]\\d{4}[\\s\\-]?\\d{5})"
      person_group: 1
      phone_group: 2
      relationship_type: "USES"
      confidence: 0.92
  person_account:
    - name: "account_of_person"
      pattern: "(?:account|a/c|acct)(?:\\s+no\\.?|\\s+number)?\\s*[:\\-]?\\s*([A-Za-z0-9]{9,18})\\s+(?:of|held\\s+by|belonging\\s+to|in\\s+the\\s+name\\s+of|operated\\s+by)\\s+(?:(?:Shri|Smt\\.?|Mr\\.?|Mrs\\.?|Ms\\.?|accused|complainant)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){0,3})"
      account_group: 1
      person_group: 2
      relationship_type: "OWNS"
      confidence: 0.93
  person_vehicle:
    - name: "vehicle_of_person"
      pattern: "vehicle(?:\\s+no\\.?)?\\s*[:\\-]?\\s*([A-Z]{2}[\\s\\-]?\\d{1,2}[\\s\\-]?[A-Z]{1,3}[\\s\\-]?\\d{4})\\s+(?:driven\\s+by|belonging\\s+to|owned\\s+by|used\\s+by)\\s+(?:(?:Shri|Smt\\.?|Mr\\.?|accused)\\s+)?((?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.?\\s+)*[A-Z][A-Za-z\\'-]+(?:[\\t ]+(?:(?:Mohd|Md|Sk|Ch|[A-Z])\\.|[A-Z][A-Za-z\\'-]+)){0,3})"
      vehicle_group: 1
      person_group: 2
      relationship_type: "DRIVES"
      confidence: 0.92

incident_fact_patterns:
  incident_place:
    - "(?:Place\\s+of\\s+Occurrence|Incident\\s+Place|Occurrence\\s+Place|Place\\s+of\\s+Incident|Ghatna\\s+Sthal)\\s*[:\\-]\\s*([^\\n.;]{4,80})"
    - "(?:occurred\\s+at|took\\s+place\\s+at|incident\\s+at|near\\s+landmark)\\s+([A-Z][A-Za-z0-9,\\s\\-]{4,65}?)(?=[.;\\n]|\\s+on\\s+\\d|\\s+dated|$)"
  incident_date_context:
    - "(?:Date\\s+(?:and\\s+Time\\s+)?of\\s+Occurrence|Incident\\s+Date|Date\\s+of\\s+Incident|Ghatna\\s+Tithi|On\\s+date|dated)\\s*[:\\-]?\\s*(\\d{1,2}[/\\-]\\d{1,2}[/\\-]\\d{2,4}(?:\\s+(?:at\\s+)?\\d{1,2}:\\d{2}(?::\\d{2})?(?:\\s*(?:AM|PM|hrs|hours))?)?|\\d{4}-\\d{2}-\\d{2}(?:[T\\s]\\d{2}:\\d{2}(?::\\d{2})?)?|\\d{1,2}(?:st|nd|rd|th)?\\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\s+\\d{2,4})"
  incident_time:
    - "(?:at\\s+about|around|time|samay)\\s*[:\\-]?\\s*(\\d{1,2}[:.]\\d{2}\\s*(?:AM|PM|am|pm|hrs|hours)?)"

